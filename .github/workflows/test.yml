name: Tests

# Run the test suite on PRs to main (and on main itself) so changes are gated.
# Integration tests spin up PostgreSQL via Testcontainers, so they need Docker —
# the ubuntu runner has it preinstalled.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel an in-progress run when the same ref is pushed again.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

  # The tests don't touch the CSS toolchain, so build it separately — otherwise a
  # Tailwind/daisyUI bump would only break at deploy time (in the Docker css stage).
  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:css
